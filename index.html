<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="呼吸训练管理器：可自定义吸气/屏息/呼气/休息时长的呼吸引导工具">
  <title>呼吸训练管理器 Breath Timer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">呼吸训练管理器</h1>
      <p class="app-subtitle">Breath Timer</p>
    </header>

    <!-- 模式选择 -->
    <section class="mode-bar card" aria-label="呼吸模式">
      <label class="mode-label" for="mode-select">模式</label>
      <select id="mode-select" class="mode-select"></select>
      <span id="mode-hint" class="mode-hint" aria-live="polite"></span>
    </section>

    <!-- 主引导区 -->
    <section class="guide card" aria-label="呼吸引导">
      <div class="guide-ring" id="guide-ring">
        <svg viewBox="0 0 260 260" class="ring-svg" aria-hidden="true">
          <circle class="ring-track" cx="130" cy="130" r="118" />
          <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="118" />
        </svg>
        <div class="guide-center">
          <div class="phase-name" id="phase-name" aria-live="polite">准备开始</div>
          <div class="phase-sub" id="phase-sub">请设置时长后点击开始</div>
          <div class="phase-remain" id="phase-remain">—</div>
        </div>
      </div>
    </section>

    <!-- 设置区 -->
    <section class="settings card" aria-label="时长设置">
      <h2 class="section-title">时长设置（秒）</h2>
      <div class="setting-row" data-field="inhaleSec">
        <span class="setting-name">吸气</span>
        <div class="stepper">
          <button type="button" class="step-btn" data-step="-1" aria-label="吸气时长减 1 秒">−</button>
          <input type="number" class="step-input" id="inhaleSec" min="1" max="60" step="1" value="2">
          <button type="button" class="step-btn" data-step="1" aria-label="吸气时长加 1 秒">+</button>
        </div>
        <span class="setting-unit">s</span>
      </div>
      <div class="setting-row" data-field="holdSec">
        <span class="setting-name">屏息</span>
        <div class="stepper">
          <button type="button" class="step-btn" data-step="-1" aria-label="屏息时长减 1 秒">−</button>
          <input type="number" class="step-input" id="holdSec" min="1" max="60" step="1" value="20">
          <button type="button" class="step-btn" data-step="1" aria-label="屏息时长加 1 秒">+</button>
        </div>
        <span class="setting-unit">s</span>
      </div>
      <div class="setting-row" data-field="exhaleSec">
        <span class="setting-name">呼气</span>
        <div class="stepper">
          <button type="button" class="step-btn" data-step="-1" aria-label="呼气时长减 1 秒">−</button>
          <input type="number" class="step-input" id="exhaleSec" min="1" max="60" step="1" value="10">
          <button type="button" class="step-btn" data-step="1" aria-label="呼气时长加 1 秒">+</button>
        </div>
        <span class="setting-unit">s</span>
      </div>
      <div class="setting-row" data-field="restSec">
        <span class="setting-name">休息</span>
        <div class="stepper">
          <button type="button" class="step-btn" data-step="-1" aria-label="休息时长减 1 秒">−</button>
          <input type="number" class="step-input" id="restSec" min="0" max="60" step="1" value="20">
          <button type="button" class="step-btn" data-step="1" aria-label="休息时长加 1 秒">+</button>
        </div>
        <span class="setting-unit">s</span>
      </div>
    </section>

    <!-- 音效与反馈 -->
    <section class="audio card" aria-label="音效设置">
      <div class="audio-row">
        <label class="audio-label" for="volume-range">音效</label>
        <input type="range" id="volume-range" min="0" max="100" value="80" class="volume-range">
        <span class="volume-value" id="volume-value">80%</span>
        <label class="toggle-label">
          <input type="checkbox" id="muted-toggle" class="toggle-input"> 静音
        </label>
      </div>
      <div class="audio-row">
        <label class="toggle-label toggle-vibrate">
          <input type="checkbox" id="vibrate-toggle" class="toggle-input"> 振动提醒（移动端）
        </label>
      </div>
    </section>

    <!-- 控制区 -->
    <section class="controls card" aria-label="训练控制">
      <button type="button" id="btn-start" class="btn btn-primary">开始</button>
      <button type="button" id="btn-pause" class="btn" hidden>暂停</button>
      <button type="button" id="btn-resume" class="btn" hidden>继续</button>
      <button type="button" id="btn-stop" class="btn btn-danger" hidden>停止</button>
    </section>

    <!-- 统计区 -->
    <section class="stats card" aria-label="训练统计">
      <div class="stat-item">
        <span class="stat-value" id="stat-cycles">0</span>
        <span class="stat-label">已完成周期</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="stat-item">
        <span class="stat-value" id="stat-elapsed">0:00</span>
        <span class="stat-label">总用时</span>
      </div>
    </section>

    <footer class="app-footer">本地运行 · 数据仅保存在本机浏览器</footer>
  </div>

  <!-- 加载顺序：纯逻辑 → 浏览器模块 → 装配（tech-design.md §3.1） -->
  <script src="js/settings.js"></script>
  <script src="js/stateMachine.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
